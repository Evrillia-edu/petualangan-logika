<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Logika</title>
<style>
:root{
  --bg:#fef6e4; --card:#fff; --primary:#6c5ce7; --primary2:#a29bfe;
  --accent:#00b894; --warn:#fd79a8; --text:#2d3436; --grid:#dfe6e9;
  --cell-size:clamp(34px, 11vw, 38px);
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1e1b2e; --card:#2a2640; --text:#f1f1f1; --grid:#3a3556;
  }
}
:root[data-theme="dark"]{ --bg:#1e1b2e; --card:#2a2640; --text:#f1f1f1; --grid:#3a3556; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Comic Sans MS',Verdana,sans-serif;min-height:100%;padding:clamp(10px, 4vw, 16px);overflow-x:hidden}
h1{text-align:center;font-size:clamp(1.25rem, 6vw, 1.5rem);color:var(--primary);margin:4px 0}
.sub{text-align:center;opacity:.8;margin-bottom:12px;font-size:.9rem}
.wrap{max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:clamp(10px, 3vw, 14px);margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
#maze{display:grid;gap:3px;margin:0 auto;width:fit-content;max-width:100%}
.cell{width:var(--cell-size);height:var(--cell-size);background:var(--grid);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(17px, 6vw, 20px);position:relative}
.wall{background:#636e72}
.goal{background:#ffeaa7}
.player{transition:transform .25s}
.palette{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:10px}
button.cmd{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:10px 8px;min-height:44px;font-size:1rem;cursor:pointer;font-family:inherit}
button.cmd.loop{background:var(--accent)}
button.cmd:active{transform:scale(.95)}
#seq{min-height:50px;background:var(--grid);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;overflow-wrap:anywhere}
.tok{background:var(--primary2);color:#fff;border-radius:8px;padding:6px 10px;font-size:.95rem;display:flex;align-items:center;gap:4px}
.tok .x{cursor:pointer;font-weight:bold;opacity:.8}
.loopwrap{background:#00b89433;border:2px dashed var(--accent);border-radius:10px;padding:4px 6px;display:flex;gap:4px;align-items:center}
.actions{display:flex;gap:10px;justify-content:center;margin-top:10px}
button.big{background:var(--warn);color:#fff;border:none;border-radius:12px;padding:12px 16px;min-height:48px;flex:1;font-size:1.05rem;cursor:pointer;font-family:inherit}
button.big.run{background:var(--accent)}
button.big.clear{background:#b2bec3}
#msg{text-align:center;font-weight:bold;min-height:1.4em;margin-top:8px}
#levelInfo{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.9rem}
.levels{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.lvlbtn{width:34px;height:34px;border-radius:50%;border:none;background:var(--grid);color:var(--text);font-weight:bold;cursor:pointer}
.lvlbtn.active{background:var(--primary);color:#fff}
.lvlbtn.done{background:var(--accent);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.hidden{display:none}
.modal{background:var(--card);border-radius:16px;padding:20px;width:min(100%,380px);text-align:center}
.modal .big-emoji{font-size:2.6rem}
.modal p{line-height:1.5;font-size:1rem}
.modal .picks{display:flex;gap:8px;justify-content:center;margin-top:12px}
.modal .pick{width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-weight:bold;font-size:1.1rem;cursor:pointer}
@media (max-width:360px){
  .actions{flex-direction:column}
  .modal{padding:16px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🤖 Petualangan Logika</h1>
<div class="sub">Susun perintah untuk membantu robot sampai ke 🚩!</div>

<div class="card">
  <div class="levels" id="levels"></div>
  <div id="levelInfo"></div>
  <div id="maze"></div>
</div>

<div class="card">
  <div class="palette">
    <button class="cmd" data-c="F">⬆️ Maju</button>
    <button class="cmd" data-c="L">↩️ Kiri</button>
    <button class="cmd" data-c="R">↪️ Kanan</button>
    <button class="cmd loop" id="addLoop">🔁 Ulangi</button>
  </div>
  <div id="seq"></div>
  <div class="actions">
    <button class="big clear" id="clearBtn">🗑️ Hapus</button>
    <button class="big run" id="runBtn">▶️ Jalankan</button>
  </div>
  <div id="msg"></div>
</div>
</div>

<div class="overlay hidden" id="loopModal">
  <div class="modal">
    <div class="big-emoji">🔁</div>
    <p><b>Ulangi</b> itu seperti kalau kamu disuruh lompat 3 kali!<br>Daripada capek pencet <b>Maju</b> berkali-kali, robot bisa disuruh <b>"ulangi beberapa langkah, beberapa kali"</b> sekaligus 😄</p>
    <p style="margin-bottom:4px">Mau diulang berapa kali?</p>
    <div class="picks">
      <button class="pick" data-n="2">2x</button>
      <button class="pick" data-n="3">3x</button>
      <button class="pick" data-n="4">4x</button>
      <button class="pick" data-n="5">5x</button>
    </div>
  </div>
</div>

<script>
// Levels: grid, start{x,y,dir 0=up1=right2=down3=left}, goal{x,y}, walls[]
const LEVELS = [
  {w:4,h:3, start:{x:0,y:2,dir:0}, goal:{x:3,y:2}, walls:[]},
  {w:5,h:3, start:{x:0,y:2,dir:0}, goal:{x:4,y:0}, walls:[]},
  {w:5,h:4, start:{x:0,y:3,dir:0}, goal:{x:4,y:0}, walls:['2,1','2,2','2,3']},
  {w:6,h:4, start:{x:0,y:0,dir:1}, goal:{x:5,y:3}, walls:['3,0','3,1','3,2']},
  {w:5,h:5, start:{x:0,y:4,dir:0}, goal:{x:4,y:0}, walls:['1,1','1,2','1,3','3,1','3,2','3,3']},
];
let curLevel = 0;
let seq = []; // array of {c:'F'/'L'/'R'} or {loop:n, body:[...]}
let done = JSON.parse(localStorageGet());

function localStorageGet(){
  try{ return localStorage.getItem('pl_done') || '[]'; }catch(e){ return '[]'; }
}
function saveDone(){
  try{ localStorage.setItem('pl_done', JSON.stringify(done)); }catch(e){}
}

const mazeEl = document.getElementById('maze');
const seqEl = document.getElementById('seq');
const msgEl = document.getElementById('msg');
const levelsEl = document.getElementById('levels');
const levelInfoEl = document.getElementById('levelInfo');

function renderLevelButtons(){
  levelsEl.innerHTML = '';
  LEVELS.forEach((_,i)=>{
    const b = document.createElement('button');
    b.className = 'lvlbtn' + (i===curLevel?' active':'') + (done.includes(i)?' done':'');
    b.textContent = done.includes(i) ? '✓' : (i+1);
    b.onclick = ()=>{ curLevel=i; seq=[]; renderAll(); };
    levelsEl.appendChild(b);
  });
}

function renderMaze(playerPos, playerDir){
  const lvl = LEVELS[curLevel];
  mazeEl.style.gridTemplateColumns = `repeat(${lvl.w}, var(--cell-size))`;
  mazeEl.innerHTML = '';
  const p = playerPos || lvl.start;
  const dir = playerDir !== undefined ? playerDir : lvl.start.dir;
  const arrows = ['⬆️','➡️','⬇️','⬅️'];
  for(let y=0;y<lvl.h;y++){
    for(let x=0;x<lvl.w;x++){
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(lvl.walls.includes(x+','+y)) cell.classList.add('wall');
      if(x===lvl.goal.x && y===lvl.goal.y && !(p.x===x&&p.y===y)) { cell.classList.add('goal'); cell.textContent='🚩'; }
      if(p.x===x && p.y===y){ cell.classList.add('player'); cell.textContent = arrows[dir]; }
      mazeEl.appendChild(cell);
    }
  }
  levelInfoEl.innerHTML = `<span>Level ${curLevel+1}</span><span>Blok: ${countBlocks(seq)}</span>`;
}

function countBlocks(s){
  let n=0;
  s.forEach(t=>{ if(t.loop){ n+=1+countBlocks(t.body); } else n+=1; });
  return n;
}

function renderSeq(){
  seqEl.innerHTML = '';
  if(seq.length===0){ seqEl.innerHTML = '<span style="opacity:.5">Tambahkan perintah di sini...</span>'; }
  seq.forEach((t,i)=> seqEl.appendChild(renderToken(t,i,seq)));
}

function labelFor(c){ return c==='F'?'⬆️Maju':c==='L'?'↩️Kiri':'↪️Kanan'; }

function renderToken(t, idx, parentArr){
  if(t.loop !== undefined){
    const wrap = document.createElement('div');
    wrap.className = 'loopwrap';
    const lbl = document.createElement('span');
    lbl.textContent = '🔁x'+t.loop;
    const body = document.createElement('div');
    body.style.display='flex'; body.style.gap='4px'; body.style.flexWrap='wrap';
    t.body.forEach((bt,bi)=> body.appendChild(renderToken(bt,bi,t.body)));
    const x = document.createElement('span'); x.className='x'; x.textContent='✕';
    x.onclick = ()=>{ parentArr.splice(idx,1); renderSeq(); renderMaze(); };
    wrap.appendChild(lbl); wrap.appendChild(body); wrap.appendChild(x);
    return wrap;
  } else {
    const tok = document.createElement('div');
    tok.className = 'tok';
    tok.innerHTML = `<span>${labelFor(t.c)}</span><span class="x">✕</span>`;
    tok.querySelector('.x').onclick = ()=>{ parentArr.splice(idx,1); renderSeq(); renderMaze(); };
    return tok;
  }
}

// simple: commands add to top-level seq, or into last loop if one is "open" — keep simple: always top-level
document.querySelectorAll('.cmd[data-c]').forEach(btn=>{
  btn.onclick = ()=>{ seq.push({c:btn.dataset.c}); renderSeq(); renderMaze(); };
});
const loopModal = document.getElementById('loopModal');
document.getElementById('addLoop').onclick = ()=>{ loopModal.classList.remove('hidden'); };
loopModal.querySelectorAll('.pick').forEach(btn=>{
  btn.onclick = ()=>{
    seq.push({loop:parseInt(btn.dataset.n), body:[]});
    loopModal.classList.add('hidden');
    renderSeq(); renderMaze();
  };
});
document.getElementById('clearBtn').onclick = ()=>{ seq=[]; renderSeq(); renderMaze(); msgEl.textContent=''; };

function flatten(s){
  let out=[];
  s.forEach(t=>{
    if(t.loop!==undefined){ for(let i=0;i<t.loop;i++) out=out.concat(flatten(t.body)); }
    else out.push(t.c);
  });
  return out;
}

async function runProgram(){
  const lvl = LEVELS[curLevel];
  if(seq.length===0){ msgEl.textContent='Tambahkan perintah dulu ya!'; msgEl.style.color='#fd79a8'; return; }
  const cmds = flatten(seq);
  let pos = {x:lvl.start.x, y:lvl.start.y};
  let dir = lvl.start.dir; // 0up 1right 2down 3left
  msgEl.textContent = ''; 
  renderMaze(pos, dir);
  await sleep(300);
  const dx=[0,1,0,-1], dy=[-1,0,1,0];
  for(const c of cmds){
    if(c==='L') dir=(dir+3)%4;
    else if(c==='R') dir=(dir+1)%4;
    else if(c==='F'){
      const nx=pos.x+dx[dir], ny=pos.y+dy[dir];
      if(nx<0||ny<0||nx>=lvl.w||ny>=lvl.h||lvl.walls.includes(nx+','+ny)){
        msgEl.textContent='💥 Robot menabrak! Coba lagi.'; msgEl.style.color='#fd79a8';
        renderMaze(pos,dir);
        return;
      }
      pos={x:nx,y:ny};
    }
    renderMaze(pos, dir);
    await sleep(350);
  }
  if(pos.x===lvl.goal.x && pos.y===lvl.goal.y){
    msgEl.textContent='🎉 Hore! Sampai tujuan!'; msgEl.style.color='#00b894';
    if(!done.includes(curLevel)){ done.push(curLevel); saveDone(); }
    renderLevelButtons();
  } else {
    msgEl.textContent='Belum sampai tujuan, coba lagi ya!'; msgEl.style.color='#fd79a8';
  }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
document.getElementById('runBtn').onclick = runProgram;

function renderAll(){ renderLevelButtons(); renderSeq(); renderMaze(); }
renderAll();
</script>
</body>
</html>
